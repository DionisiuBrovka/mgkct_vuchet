# docker compose -f docker/docker-compose.yml up -d --build
services:
  mgkct:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: mgkct_vuchet:latest
    container_name: mgkct
    restart: unless-stopped
    ports:
      # хост:контейнер — 8090 наружу, доступ по локальной сети
      - "8090:8090"
    volumes:
      # именованный том для базы и файлов PocketBase (переживает пересоздание контейнера)
      - mgkct_data:/pb/pb_data
    environment:
      # пароль суперюзера (для входа в /_/), задаётся при первом запуске
      PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD:-admin123456}
      PB_SUPERUSER_EMAIL: ${PB_SUPERUSER_EMAIL:-admin@mgkct.local}

volumes:
  mgkct_data:
