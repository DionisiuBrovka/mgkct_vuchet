name: mgkct_teaching_hours
description: "Учёт вычитанных часов преподавателей"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # PocketBase backend
  pocketbase: ^0.25.0
  http: ^1.2.0

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Models
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # DI & Navigation
  get_it: ^8.0.0
  go_router: ^14.0.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/back.png
