name: mgkct_teaching_hours
description: "Учёт вычитанных часов преподавателей"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  web: ^1.1.1

  # Shelf API client
  http: ^1.2.0

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Models
  freezed_annotation: ^2.4.1

  # DI & Navigation
  get_it: ^8.0.0
  go_router: ^14.0.0

  # Utils
  uuid: ^4.4.0
  cupertino_icons: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/back.png
